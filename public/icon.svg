<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#0C3B78" />
      <stop offset="55%" stop-color="#071D42" />
      <stop offset="100%" stop-color="#030B1D" />
    </radialGradient>
    <radialGradient id="cyanHalo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#0EA5E9" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="textHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#BAE6FD" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Deep Tech Backdrop -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />

  <!-- Subtle Tech Hexagons & Circuit Traces -->
  <g stroke="#1E60A8" stroke-width="2" opacity="0.45">
    <polygon points="62,48 96,28 130,48 130,88 96,108 62,88" fill="#0B2E63" fill-opacity="0.45" />
    <polygon points="130,88 164,68 198,88 198,128 164,148 130,128" fill="#0B2E63" fill-opacity="0.35" />
    <polygon points="28,108 62,88 96,108 96,148 62,168 28,148" fill="#0B2E63" fill-opacity="0.35" />
    <polygon points="348,408 382,388 416,408 416,448 382,468 348,448" fill="#0B2E63" fill-opacity="0.45" />
    <polygon points="280,446 314,426 348,446 348,486 314,506 280,486" fill="#0B2E63" fill-opacity="0.35" />
  </g>

  <!-- Circuit Board Lines & Nodes -->
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.72">
    <path d="M0 206 H48 L72 182 H112" />
    <path d="M0 248 H76 L98 270 H134" />
    <path d="M0 326 H54 L84 296 H120" />
    <path d="M512 134 H438 L408 164 H368" />
    <path d="M512 192 H454 L434 212 H392" />
    <path d="M512 248 H426 L396 278 H366" />
    <path d="M512 312 H458 L428 282" />
    <path d="M126 396 L84 438 H28" />
  </g>
  <g fill="#7DD3FC">
    <circle cx="112" cy="182" r="4.5" />
    <circle cx="134" cy="270" r="4.5" />
    <circle cx="120" cy="296" r="4.5" />
    <circle cx="368" cy="164" r="4.5" />
    <circle cx="392" cy="212" r="4.5" />
    <circle cx="366" cy="278" r="4.5" />
    <circle cx="84" cy="438" r="5" />
    <circle cx="88" cy="378" r="7" filter="url(#glow)" />
    <circle cx="430" cy="96" r="6" filter="url(#glow)" />
  </g>

  <!-- Central Cyan HUD Glow -->
  <circle cx="256" cy="226" r="196" fill="url(#cyanHalo)" />

  <!-- Concentric Futuristic HUD Rings -->
  <circle cx="256" cy="226" r="174" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.55" />
  <circle cx="256" cy="226" r="154" stroke="#7DD3FC" stroke-width="6" stroke-dasharray="18 8 4 8" stroke-opacity="0.85" filter="url(#glow)" />
  <circle cx="256" cy="226" r="134" stroke="#0EA5E9" stroke-width="3" stroke-opacity="0.9" />
  <circle cx="256" cy="226" r="116" stroke="#E0F2FE" stroke-width="10" stroke-dasharray="5 9" stroke-opacity="0.85" />
  <circle cx="256" cy="226" r="96" stroke="#38BDF8" stroke-width="3.5" stroke-opacity="0.95" />

  <!-- Bold Black Layered Open Book Emblem -->
  <!-- Outer dark cover edges -->
  <path d="M88 128 C134 128 190 132 256 168 C322 132 378 128 424 128 L434 268 C374 268 312 280 256 306 C200 280 138 268 78 268 Z" fill="#020617" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round" />
  <!-- Middle cyan page separation outline -->
  <path d="M104 114 C150 112 204 120 256 154 C308 120 362 112 408 114 L414 252 C360 250 306 262 256 290 C206 262 152 250 98 252 Z" fill="#020617" stroke="#7DD3FC" stroke-width="4" stroke-linejoin="round" />
  <!-- Top solid open pages -->
  <path d="M126 98 C168 96 216 106 256 138 C296 106 344 96 386 98 L392 238 C346 234 298 246 256 276 C214 246 166 234 120 238 Z" fill="#030712" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round" />
  <!-- Center Spine Accent -->
  <path d="M256 138 L256 276" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />

  <!-- Stylized Brand Title with Cyan/White Halo -->
  <text
    x="256"
    y="354"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="47"
    letter-spacing="0.5"
    fill="#020617"
    filter="url(#textHalo)"
  >ASAN &#8211; Study Tool</text>
</svg>
